<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jungle Sketchbook Parent Controls</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="home">
    <main class="card admin-card">
      <h1>Parent controls</h1>
      <section id="loginPanel">
        <p>Enter the PIN configured on the sketchbook server.</p>
        <form id="loginForm" class="admin-form">
          <label for="pin">Admin PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" required>
          <button class="button" type="submit">Unlock controls</button>
        </form>
      </section>

      <section id="controlsPanel" hidden>
        <form id="settingsForm" class="admin-form inline-settings">
          <label>
            <input id="paused" type="checkbox">
            Pause new arrivals
          </label>
          <label for="maxAnimals">Keep newest drawings</label>
          <input id="maxAnimals" type="number" min="1" max="100" required>
          <button class="button" type="submit">Save settings</button>
        </form>

        <div class="admin-actions">
          <button id="refresh" class="button secondary" type="button">Refresh</button>
          <button id="clearAll" class="button danger" type="button">Clear all drawings</button>
        </div>
        <div id="animalList" class="animal-list"></div>
      </section>
      <p id="adminStatus" class="status" aria-live="polite"></p>
      <a href="/">Back to launcher</a>
    </main>
    <script src="/species.js"></script>
    <script src="/admin.js"></script>
  </body>
</html>
