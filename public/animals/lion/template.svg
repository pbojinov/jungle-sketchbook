  <path d="M250 567 L270 567 L260 579 Z" fill="#888"/>
  <path class="detail" d="M260 579 L260 590 M260 590 C247 603 235 599 230 590 M260 590 C273 603 285 599 290 590"/>

  <!-- Mane, shoulder, belly and leg guides. -->
  <path class="detail" d="M178 470 C150 505 140 548 145 585
    M215 425 C180 445 158 470 145 500
    M320 425 C360 448 383 480 393 520
    M142 620 C155 660 180 688 215 705
    M315 710 C350 690 375 660 388 625"/>
  <path class="detail" d="M382 530 C415 565 425 620 410 675"/>
  <path class="detail" d="M370 720 C430 742 540 744 615 720"/>
