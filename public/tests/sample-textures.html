<!doctype html><html lang="en"><meta charset="utf-8"><title>Sample texture checks</title>
<pre id="result">Checking sample textures…</pre>
<script src="/samples.js?v=20260930"></script>
<script>
(async () => {
  const catalog = await (await fetch('/animals/catalog.json')).json();
  for (const species of Object.keys(catalog)) {
    await new Promise((resolve,reject) => {
      const script=document.createElement('script');script.src=`/animals/${species}/shape.js`;
      script.onload=resolve;script.onerror=reject;document.head.append(script);
    });
    const texture = await sampleTexture(species);
    const image = new Image();image.src=texture;await image.decode();
    const bounds=AnimalShapes[species].bounds;
    if(image.width!==bounds.width||image.height!==bounds.height) throw Error(`${species} crop mismatch`);
    const canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;
    const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0);
    if(ctx.getImageData(0,0,1,1).data[3]!==0) throw Error(`${species} background is opaque`);
    document.body.append(image);
  }
  document.querySelector('#result').textContent='PASS: all six samples load at matching crop dimensions with transparent backgrounds.';
})().catch(error => { document.querySelector('#result').textContent = `FAIL: ${error.message}`; });
</script></html>
