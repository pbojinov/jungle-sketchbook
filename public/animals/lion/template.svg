<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 840 1188">
  <rect width="840" height="1188" fill="white"/>
  <style>
    .outline { fill: white; stroke: #666; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
    .detail { fill: none; stroke: #999; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .marker { fill: #111; }
    text { font-family: Arial, sans-serif; fill: #555; }
  </style>

  <!-- ArUco IDs 0–3: TL, TR, BR, BL. -->
  <image href="/markers/0.svg" x="25" y="25" width="76" height="76"/>
  <image href="/markers/1.svg" x="739" y="25" width="76" height="76"/>
  <image href="/markers/2.svg" x="739" y="1087" width="76" height="76"/>
  <image href="/markers/3.svg" x="25" y="1087" width="76" height="76"/>

  <text x="420" y="145" font-size="44" text-anchor="middle" font-weight="700">LIVE SKETCHBOOK — LION</text>
  <text x="420" y="190" font-size="22" text-anchor="middle">Color inside the lion. Leave the corner markers visible.</text>

  <!-- Long, simple body and two near-side legs. -->
