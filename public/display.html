<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jungle Sketchbook Safari</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #142119;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #hud,
      #clear {
        position: fixed;
        top: 16px;
        color: white;
        background: #0008;
        border-radius: 12px;
        font: 600 14px system-ui;
      }

      #hud {
        left: 16px;
        padding: 10px 14px;
      }

      #clear {
        right: 16px;
        padding: 9px 12px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="hud" aria-live="polite">Live Sketchbook Safari · waiting for animals…</div>
    <button id="clear">Clear</button>
  <script src="/species.js"></script>
  <script src="/display.js"></script>
  </body>
</html>
