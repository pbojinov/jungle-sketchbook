<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jungle Sketchbook Safari</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #142119;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #hud, button {
        color: white;
        background: #0009;
        border-radius: 12px;
        font: 600 14px system-ui;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        padding: 10px 14px;
      }
      #controls {
        position: fixed;
        bottom: 16px;
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        padding: 12px 16px;
        min-height: 44px;
        border: 1px solid #ffffff40;
        cursor: pointer;
      }
      button:hover { background: #245653; }
      button:focus-visible { outline: 3px solid #ffd88c; outline-offset: 3px; }
      button:disabled { opacity: 0.6; cursor: wait; }
      #arrivals {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 78px;
        color: #e7f8eb;
        font: 500 12px system-ui;
        pointer-events: none;
      }
      #arrivals[hidden] { display: none; }
      #arrivals-title { margin: 0 0 4px; text-align: center; letter-spacing: 0.04em; }
      #arrival-list {
        display: flex;
        gap: 18px;
        overflow-x: auto;
        padding: 12px 8px 6px;
        pointer-events: auto;
        scrollbar-width: thin;
        scroll-behavior: smooth;
      }
      .arrival {
        position: relative;
        flex: 0 0 108px;
        text-align: center;
        background: radial-gradient(ellipse at 50% 65%, #376d6455, transparent 70%);
      }
      .arrival img {
        display: block;
        width: 108px;
        height: 72px;
        object-fit: contain;
        filter: drop-shadow(0 5px 4px #00171480);
        animation: appear 420ms cubic-bezier(.2,.7,.2,1) both;
      }
      .arrival span { display: block; margin-top: 6px; text-shadow: 0 2px 4px #000; }
      .arrival::before, .arrival::after {
        content: '';
        position: absolute;
        left: 28px;
        top: 24px;
        width: 52px;
        height: 34px;
        border-radius: 50%;
        background: #e0eee3;
        box-shadow: -22px 4px 0 -5px #e0eee3, 22px 4px 0 -5px #e0eee3, 0 -14px 0 -4px #e0eee3;
        animation: poof 450ms ease-out both;
        z-index: 1;
        pointer-events: none;
      }
      .arrival::after { animation-delay: 40ms; }
      @keyframes poof {
        0% { opacity: 0; transform: scale(.2); }
        18% { opacity: .9; }
        100% { opacity: 0; transform: translateY(-12px) scale(1.9); }
      }
      @keyframes appear {
        0%, 15% { opacity: 0; transform: scale(.7); }
        70% { opacity: 1; transform: scale(1.06); }
        100% { opacity: 1; transform: scale(1); }
      }
      @media (max-width: 560px) { #arrivals { bottom: 130px; } }
      @media (prefers-reduced-motion: reduce) {
        .arrival img { animation: none; }
        .arrival::before, .arrival::after { display: none; }
        #arrival-list { scroll-behavior: auto; }
      }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="hud" aria-live="polite">Live Sketchbook Safari · waiting for animals…</div>
    <section id="arrivals" aria-label="New drawings waiting to join" hidden>
      <p id="arrivals-title">Welcome to the jungle · waiting for a clear path</p>
      <div id="arrival-list" role="list"></div>
    </section>
    <div id="controls" role="group" aria-label="Safari controls">
      <button data-species="lion">🦁 Add lion</button>
      <button data-species="fox">🦊 Add fox</button>
      <button data-species="zebra">🦓 Add zebra</button>
      <button data-species="gazelle">🦌 Add gazelle</button>
      <button id="clear">Clear</button>
    </div>
    <script src="/motion.js?v=7"></script>
    <script src="/animals/lion/shape.js"></script>
    <script src="/animals/fox/shape.js"></script>
    <script src="/animals/zebra/shape.js"></script>
    <script src="/animals/gazelle/shape.js"></script>
    <script src="/samples.js?v=1"></script>
    <script src="/scene.js?v=1"></script>
    <script src="/display.js?v=11"></script>
    <script src="/demo.js?v=4"></script>
  </body>
</html>
